version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          actions:
              patterns: ['*']
    - package-ecosystem: 'bun'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          # Minor and patch updates arrive as one pull request; a major one comes on its own.
          minor-and-patch:
              update-types: ['minor', 'patch']
