version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          actions:
              patterns: ['*']
    - package-ecosystem: 'bun'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          # Minor and patch updates arrive as one pull request; a major one comes on its own.
          minor-and-patch:
              update-types: ['minor', 'patch']
      ignore:
          # KaTeX is a peer apps install themselves, and before 1.0 its minor versions break; move it
          # on purpose, with a note for apps.
          - dependency-name: 'katex'
            update-types: ['version-update:semver-minor', 'version-update:semver-major']
          # CI runs in Playwright's image pinned by tag and digest; the package moves with it, by hand
          # (src/rules.test.ts fails when they differ).
          - dependency-name: '@playwright/test'
          # satellite.js 7 starts its WASM worker from its main entry, which no app on Vite's default
          # worker format can build; docs/roadmap.md says what moves it.
          - dependency-name: 'satellite.js'
            update-types: ['version-update:semver-major']
