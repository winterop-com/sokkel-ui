name: release

on:
    push:
        tags: ['v*']

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Every branch with its history, to check the tag is on main; no token is left in the checkout for later steps.
                  fetch-depth: 0
                  persist-credentials: false
            # A release is made from a commit main holds, so a tag on another branch publishes nothing.
            - name: The tag is on main
              run: |
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: https://npm.pkg.github.com
                  scope: '@winterop-com'
            # Bun from npm rather than GitHub's release downloads, which fail when GitHub's are down.
            - run: npm install -g "bun@$(cat .bun-version)" --registry https://registry.npmjs.org
            - run: bun install --frozen-lockfile
            # The packages ship together, so every one of them carries the tag's version.
            - name: The tag names the version in every package.json
              run: |
                  for package in packages/*/; do
                      version=$(node -p "require('./${package}package.json').version")
                      test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, ${package}package.json $version"; exit 1; }
                  done
            - run: bun run fmt:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            - run: bun scripts/build-tokens.ts --check
            - run: bun run components -- --check
            - run: bun run emoji-data -- --check
            # The pinned copy of the sokkel-design contract that src/parts.test.ts reads; skipped when GitHub cannot be reached.
            - run: bun run design --check
            # A release never ships tokens the design contract was not resolved from.
            - run: bun run design --tokens
            - run: bun run build
            # The size budgets, as CI checks them: a release never ships over budget while main is red on it.
            - run: bun run size
            # bun packs each package with its `workspace:` dependency on the core written as the version,
            # and npm publishes the tarballs, core first, since the add-ons name it as a peer. Every folder in
            # packages/ is packed, so a new add-on ships without a change here.
            - name: Pack the packages
              run: for package in packages/*/; do (cd "$package" && bun pm pack --destination ../../packed); done
            # A tarball whose name and version the registry already holds is skipped, so a re-run finishes a
            # release that stopped partway. Any other failure stops the step.
            - name: Publish the packages
              run: |
                  set -euo pipefail
                  published=()
                  skipped=()
                  for tarball in packed/winterop-com-sokkel-ui-[0-9]*.tgz packed/winterop-com-sokkel-ui-[a-z]*.tgz; do
                      manifest=$(tar -xzOf "$tarball" package/package.json)
                      name=$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")
                      version=$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")
                      if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
                          echo "$name@$version is already published, skipping"
                          skipped+=("$name@$version")
                          continue
                      fi
                      npm publish "./$tarball"
                      published+=("$name@$version")
                  done
                  echo "Published: ${published[*]:-none}"
                  echo "Already there: ${skipped[*]:-none}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
