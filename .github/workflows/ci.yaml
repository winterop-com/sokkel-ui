name: ci

# The fast gates, then every story against its screenshot baseline and at the narrow widths.
# Baselines are not in the code's tree; scripts/baselines.sh fetches them into e2e/__screenshots__:
#   - `baselines` holds main's, as a single commit;
#   - `baselines-for/<branch>` holds a branch's own, made by the screenshots workflow: one commit on
#     top of `baselines` with what the branch changed. A branch is compared against `baselines`
#     with its own commit laid over them, or against `baselines` alone when it has none.
# On a push to main, the `baselines` job first finds the PR the push merged (through the API, from
# the pushed commit); if that PR's branch has baselines of its own, it lays them onto `baselines`
# and deletes its branch, so the visual jobs after it compare main against what the PR approved.
on:
    # A run can also be started by hand; the screenshots workflow starts one after a retake.
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:

# One run per branch at a time: a newer push, or the run a retake starts, cancels the run it
# replaces, which would only fail on the baselines the retake is about to change. Runs on main
# never cancel one another, so every merge lays its baselines down.
concurrency:
    group: ci-${{ (github.head_ref || github.ref_name) == 'main' && github.run_id || (github.head_ref || github.ref_name) }}
    cancel-in-progress: true

jobs:
    # Whether anything a story draws changed; a change to docs, Markdown or the Makefile alone skips
    # the screenshot and layout jobs. Pushes to main always run them.
    changes:
        runs-on: ubuntu-latest
        outputs:
            drawn: ${{ github.event_name != 'pull_request' || steps.filter.outputs.drawn == 'true' }}
        steps:
            - uses: actions/checkout@v5
            - id: filter
              uses: dorny/paths-filter@v3
              with:
                  predicate-quantifier: every
                  filters: |
                      drawn:
                          - '**'
                          - '!docs/**'
                          - '!**/*.md'
                          - '!Makefile'

    baselines:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        concurrency:
            group: baselines
            cancel-in-progress: false
        env:
            GIT_AUTHOR_NAME: github-actions[bot]
            GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            GIT_COMMITTER_NAME: github-actions[bot]
            GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        steps:
            - uses: actions/checkout@v5
            - name: Lay the merged PR's baselines onto main's
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                      --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.ref // ""')
                  if [ -z "$branch" ]; then
                      echo 'This push merged no PR.'
                  else
                      scripts/baselines.sh promote "$branch"
                  fi

    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun scripts/build-tokens.ts --check
            - run: bun run components -- --check
            - run: bun run fmt:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
            # A forms page, a dashboard and a map page built against the package, each within its budget.
            - run: bun run size
            - run: bun run build-storybook

    # Every story against its screenshot, split across four machines so a PR waits for one quarter.
    visual:
        needs: [changes, baselines]
        if: >-
            !cancelled() && needs.changes.outputs.drawn == 'true' &&
            (needs.baselines.result == 'success' || needs.baselines.result == 'skipped')
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        env:
            CI: '1'
        steps:
            - uses: actions/checkout@v5
            - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - run: scripts/baselines.sh checkout "$BRANCH"
              env:
                  BRANCH: ${{ github.head_ref || github.ref_name }}
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            - run: bunx playwright test e2e/stories.spec.ts --shard=${{ matrix.shard }}/4
            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: screenshot-diffs-${{ matrix.shard }}
                  path: test-results/
                  retention-days: 7

    # Every story at the narrow widths, failing on sideways scrolling, beside the screenshots.
    layout:
        needs: changes
        if: needs.changes.outputs.drawn == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        env:
            CI: '1'
        steps:
            - uses: actions/checkout@v5
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            - run: bunx playwright test e2e/layout.spec.ts --shard=${{ matrix.shard }}/2
