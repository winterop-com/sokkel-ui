name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    # Whether anything a story draws changed; a change to docs, Markdown or the Makefile alone skips
    # the screenshot and layout jobs. Pushes to main always run them.
    changes:
        runs-on: ubuntu-latest
        outputs:
            drawn: ${{ github.event_name == 'push' || steps.filter.outputs.drawn == 'true' }}
        steps:
            - uses: actions/checkout@v5
            - id: filter
              uses: dorny/paths-filter@v3
              with:
                  predicate-quantifier: every
                  filters: |
                      drawn:
                          - '**'
                          - '!docs/**'
                          - '!**/*.md'
                          - '!Makefile'

    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun scripts/build-tokens.ts --check
            - run: bun run fmt:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
            # A forms page, a dashboard and a map page built against the package, each within its budget.
            - run: bun run size
            - run: bun run build-storybook

    # Every story against its screenshot, split across four machines so a PR waits for one quarter.
    visual:
        needs: changes
        if: needs.changes.outputs.drawn == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        env:
            CI: '1'
        steps:
            - uses: actions/checkout@v5
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            - run: bunx playwright test e2e/stories.spec.ts --shard=${{ matrix.shard }}/4
            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: screenshot-diffs-${{ matrix.shard }}
                  path: test-results/
                  retention-days: 7

    # Every story at the narrow widths, failing on sideways scrolling, beside the screenshots.
    layout:
        needs: changes
        if: needs.changes.outputs.drawn == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        env:
            CI: '1'
        steps:
            - uses: actions/checkout@v5
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            - run: bunx playwright test e2e/layout.spec.ts --shard=${{ matrix.shard }}/2
