name: ci

# The fast gates, then every story rendered at the narrow widths: a story fails when it throws or
# its page scrolls sideways. Screenshot comparison is off until the looks settle near 1.0; the
# screenshots workflow and scripts/baselines.sh still retake baselines by hand.
on:
    # A run can also be started by hand; the screenshots workflow starts one after a retake.
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:

# One run per branch at a time: a newer push, or the run a retake starts, cancels the run it
# replaces, which would only fail on the baselines the retake is about to change. Runs on main
# never cancel one another, so every merge lays its baselines down.
concurrency:
    group: ci-${{ (github.head_ref || github.ref_name) == 'main' && github.run_id || (github.head_ref || github.ref_name) }}
    cancel-in-progress: true

jobs:
    # Whether anything a story draws changed; a change to docs, Markdown or the Makefile alone skips
    # the layout job. Pushes to main always run them.
    changes:
        runs-on: ubuntu-latest
        outputs:
            drawn: ${{ github.event_name != 'pull_request' || steps.filter.outputs.drawn == 'true' }}
        steps:
            - uses: actions/checkout@v5
            - id: filter
              uses: dorny/paths-filter@v3
              with:
                  predicate-quantifier: every
                  filters: |
                      drawn:
                          - '**'
                          - '!docs/**'
                          - '!**/*.md'
                          - '!Makefile'

    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun scripts/build-tokens.ts --check
            - run: bun run components -- --check
            - run: bun run fmt:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
            # A forms page, a dashboard and a map page built against the package, each within its budget.
            - run: bun run size
            - run: bun run build-storybook

    # Every story at the narrow widths, failing when it throws or its page scrolls sideways.
    layout:
        needs: changes
        if: needs.changes.outputs.drawn == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        env:
            CI: '1'
        steps:
            - uses: actions/checkout@v5
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            - run: bunx playwright test e2e/layout.spec.ts --shard=${{ matrix.shard }}/2
            # The data-entry parts and the frame's keys driven as a person would: submit, refusal,
            # files, repeated rows, and focus the palette gives back to the search.
            - if: matrix.shard == 1
              run: bunx playwright test e2e/forms.spec.ts e2e/keys.spec.ts
