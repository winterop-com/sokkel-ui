name: examples

# The examples build against the library, so a change to either can break them: they run when the
# examples change, every night against main, and by hand. Each folder in examples/ with a web/,
# electron/ and tauri/ is one example; the size apps in size/ are built by ci.yaml instead.
on:
    pull_request:
        paths: ['examples/**', '.bun-version', '.github/workflows/examples.yaml']
    push:
        branches: [main]
        paths: ['examples/**', '.bun-version', '.github/workflows/examples.yaml']
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            # The shells all lock one Electron, so its binary is fetched once (below), not in every install.
            ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
            # One Cargo target folder for every example's Tauri shell, as the Makefiles use.
            CARGO_TARGET_DIR: ${{ github.workspace }}/examples/.cargo-target
            # The Tauri shells are built to be started, not debugged: without debug info they stay small and link fast.
            CARGO_PROFILE_DEV_DEBUG: '0'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: npm install -g "bun@$(cat .bun-version)"
            - run: bun install --frozen-lockfile
            - run: bun run build
            - name: Web apps
              run: |
                  for app in examples/*/web; do
                      (cd "$app" && bun install --frozen-lockfile && bun run build) || exit 1
                  done
            - name: Electron shells
              run: |
                  for shell in examples/*/electron; do
                      (cd "$shell" && bun install --frozen-lockfile && bun run build:main) || exit 1
                  done
            - name: Electron binary
              working-directory: examples/tasks/electron
              run: env -u ELECTRON_SKIP_BINARY_DOWNLOAD bun node_modules/electron/install.js
            - name: Tauri system libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool imagemagick
            - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
              with:
                  toolchain: stable
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  cache-directories: examples/.cargo-target
            - name: Tauri shells
              run: |
                  for shell in examples/*/tauri/src-tauri; do
                      (cd "$shell" && cargo build --locked) || exit 1
                  done
            # Each shell started once on a virtual display, in a network namespace with only loopback,
            # so no shell reaches a public source; scripts/shell-stills.ts says what fails a shell.
            - name: Start each shell
              run: >-
                  sudo unshare --net -- sh -c 'ip link set lo up &&
                  exec sudo -u "$1" env PATH="$2" HOME="$3" CARGO_TARGET_DIR="$4" GITHUB_ACTIONS="$5"
                  xvfb-run -a -s "-screen 0 1920x1080x24" bun scripts/shell-stills.ts --out shell-stills'
                  sh "$(id -un)" "$PATH" "$HOME" "$CARGO_TARGET_DIR" "$GITHUB_ACTIONS"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: shell-stills
                  path: shell-stills/
                  if-no-files-found: ignore
