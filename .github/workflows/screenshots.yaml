name: screenshots

# Retakes every screenshot baseline in the same Playwright image the visual job compares in, and
# commits them back to the branch it was started on. Start it with `make screenshots-ci` or from
# the Actions tab after a change that alters how stories look; then CI's visual job compares
# against them.
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        env:
            CI: '1'
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.ref_name }}
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            - run: bunx playwright test e2e/stories.spec.ts --update-snapshots
            - name: Commit the baselines
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add e2e/__screenshots__
                  if git diff --cached --quiet; then
                      echo 'The baselines are unchanged.'
                  else
                      git commit -m 'test: retake the screenshot baselines'
                      git push origin "HEAD:${{ github.ref_name }}"
                  fi
