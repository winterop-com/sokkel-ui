name: screenshots

# Retakes screenshot baselines in the same Playwright image the visual job compares in, and commits
# them back to the branch it was started on. `stories` narrows it to the story ids matching a
# pattern, so a change to a few stories retakes in minutes; empty retakes every story. Start it with
# `make screenshots-ci`, or `make screenshots-ci STORIES='foundations-icons|apps-music'`.
on:
    workflow_dispatch:
        inputs:
            stories:
                description: 'Story ids to retake, as a pattern; empty for every story'
                required: false
                default: ''

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        env:
            CI: '1'
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.ref_name }}
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            - run: touch /tmp/started
            - run: bunx playwright test e2e/stories.spec.ts --update-snapshots ${STORIES:+-g "$STORIES"}
              env:
                  STORIES: ${{ inputs.stories }}
            - run: scripts/compress-screenshots.sh /tmp/started
            - name: Commit the baselines
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add e2e/__screenshots__
                  if git diff --cached --quiet; then
                      echo 'The baselines are unchanged.'
                  else
                      git commit -m 'test: retake the screenshot baselines'
                      git push origin "HEAD:${{ github.ref_name }}"
                  fi
