name: screenshots

# Retakes screenshot baselines in the same Playwright image the visual job compares in. The
# baselines never enter the code's tree; they live on branches of their own, which
# scripts/baselines.sh reads and writes:
#   - run on main, it retakes into `baselines`, which always holds a single commit;
#   - run on any other branch, it retakes into `baselines-for/<branch>`: one commit on top of
#     `baselines` with what the branch changed. CI compares that branch against it, and when the
#     branch's PR merges, the ci workflow lays it onto `baselines` and deletes it.
# `stories` narrows the retake to the story ids matching a pattern, so a change to a few stories
# retakes in minutes; empty retakes every story. Start it with `make screenshots-ci`, or
# `make screenshots-ci STORIES='foundations-icons|apps-music'`. Once the baselines are pushed, it
# starts the ci workflow on the branch again, as its own push starts none.
on:
    workflow_dispatch:
        inputs:
            stories:
                description: 'Story ids to retake, as a pattern; empty for every story'
                required: false
                default: ''

permissions:
    contents: write
    actions: write

# Two retakes of one branch's baselines, or a retake on main and a merge's update of `baselines`,
# never run at once.
concurrency:
    group: ${{ github.ref_name == 'main' && 'baselines' || format('baselines-for/{0}', github.ref_name) }}
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        env:
            CI: '1'
            BRANCH: ${{ github.ref_name }}
            GIT_AUTHOR_NAME: github-actions[bot]
            GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            GIT_COMMITTER_NAME: github-actions[bot]
            GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.ref_name }}
            - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            - run: scripts/baselines.sh checkout "$BRANCH"
            - run: touch /tmp/started
            - run: bunx playwright test e2e/stories.spec.ts --update-snapshots ${STORIES:+-g "$STORIES"}
              env:
                  STORIES: ${{ inputs.stories }}
            - run: scripts/compress-screenshots.sh /tmp/started
            - run: scripts/baselines.sh commit "$BRANCH"

    rerun-ci:
        needs: update
        runs-on: ubuntu-latest
        steps:
            - run: gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ github.ref_name }}
