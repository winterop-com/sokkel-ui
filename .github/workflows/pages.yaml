name: storybook

# Publishes only a commit on main whose CI passed.
on:
    workflow_run:
        workflows: [ci]
        types: [completed]
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        # Runs once GitHub Pages is enabled for the repository with GitHub Actions as its source.
        if: github.event.repository.has_pages && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: storybook-static
            - id: deployment
              uses: actions/deploy-pages@v4
