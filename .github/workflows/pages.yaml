name: storybook

# Publishes main's Storybook on every push to main, without waiting for CI (as merges do not), and
# beside it, under examples/, every example's web app with an index of them.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# A newer push cancels the build of an older one, so the newest commit is the one published.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        # Runs once GitHub Pages is enabled for the repository with GitHub Actions as its source.
        if: github.event.repository.has_pages
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v5
            - run: npm install -g bun
            - run: bun install --frozen-lockfile
            - run: bun run build-storybook
            # The examples install the built packages; chromium takes each one's still for the index.
            - run: bun run build
            - run: bunx playwright install --with-deps chromium
            - run: bun scripts/examples-site.ts --shots --out storybook-static/examples
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: storybook-static
            - id: deployment
              uses: actions/deploy-pages@v4
