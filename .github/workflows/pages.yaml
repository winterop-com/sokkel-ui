name: storybook

# Publishes only a commit on main whose CI passed.
on:
    workflow_run:
        workflows: [ci]
        types: [completed]
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Runs queue rather than cancel one another, so a run for an older commit cannot cancel a newer one.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        # Runs once GitHub Pages is enabled for the repository with GitHub Actions as its source.
        if: github.event.repository.has_pages && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            # A commit main has moved past is not published: the newer commit's own CI publishes it.
            - id: latest
              env:
                  EVENT: ${{ github.event_name }}
                  BUILT: ${{ github.event.workflow_run.head_sha }}
              run: |
                  head=$(git ls-remote origin refs/heads/main | cut -f1)
                  if [ "$EVENT" = workflow_run ] && [ "$head" != "$BUILT" ]; then
                      echo "main is at $head, past $BUILT; not publishing"
                      echo "stale=true" >> "$GITHUB_OUTPUT"
                      echo "Not published: main has moved past $BUILT to $head, whose own run publishes it." >> "$GITHUB_STEP_SUMMARY"
                  fi
            - if: steps.latest.outputs.stale != 'true'
              uses: oven-sh/setup-bun@v2
            - if: steps.latest.outputs.stale != 'true'
              run: bun install --frozen-lockfile
            - if: steps.latest.outputs.stale != 'true'
              run: bun run build-storybook
            - if: steps.latest.outputs.stale != 'true'
              uses: actions/configure-pages@v5
            - if: steps.latest.outputs.stale != 'true'
              uses: actions/upload-pages-artifact@v4
              with:
                  path: storybook-static
            - if: steps.latest.outputs.stale != 'true'
              id: deployment
              uses: actions/deploy-pages@v4
